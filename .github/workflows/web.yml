# Builds the browser version and publishes it to GitHub Pages: https://nkosie199.github.io/MoreHoles/
# That link works for anyone, so it's the Launch URL to use on LuckyB (Publish a Game -> New Tab).
name: Publish the web version

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build the web version
        run: bash ./gradlew html:dist --no-daemon
      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: html/build/dist
